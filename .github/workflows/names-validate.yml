name: names-validate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  names-validate:
    name: names-validate
    if: github.repository == 'joevdotme/Nikke-Manager-Extension'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Name map check
        run: node scripts/validate-name-map.js --base "origin/${{ github.base_ref }}"
